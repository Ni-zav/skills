name: validate-skills

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run dashboard
      - run: git diff --exit-code -- DASHBOARD.md skills.json
      - run: npm run validate
